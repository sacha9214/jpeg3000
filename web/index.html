<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPEG 3000 viewer</title>
<meta name="description" content="Open .j3k images (JPEG 3000) in any browser: no install, nothing uploaded.">
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6b6b70; --card: #fff; --line: #e2e2e0; --accent: #2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121214; --fg: #ececee; --muted: #9a9aa2; --card: #1c1c20; --line: #2c2c32; --accent: #7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  a { color: var(--accent); }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; cursor: pointer; background: var(--card); transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); }
  #drop strong { color: var(--accent); }
  #drop input { display: none; }
  #error { color: #d33; margin: 12px 0 0; min-height: 1.5em; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 20px; overflow: hidden; }
  .item header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .item header b { word-break: break-all; }
  .item header span { color: var(--muted); font-size: 14px; }
  .item header button { margin-left: auto; font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .item header button:hover { border-color: var(--accent); color: var(--accent); }
  .canvas-wrap { padding: 16px; background-image: conic-gradient(#8882 25%, transparent 0 50%, #8882 0 75%, transparent 0); background-size: 20px 20px; }
  canvas, .demo img { display: block; max-width: 100%; height: auto; margin: 0 auto; image-rendering: auto; }
  .demo { margin-top: 32px; }
  .demo h2 { font-size: 18px; margin: 0 0 8px; }
  .demo p { color: var(--muted); margin: 0 0 12px; }
  code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>JPEG 3000 viewer</h1>
  <p class="lead">Open <code>.j3k</code> images in any browser. Decoding happens on your device: nothing is uploaded.</p>

  <label id="drop">
    <input id="file" type="file" accept=".j3k" multiple>
    Drop <code>.j3k</code> files here or <strong>choose files</strong>
  </label>
  <p id="error" role="alert"></p>
  <div id="list"></div>

  <section class="demo">
    <h2>Example</h2>
    <p>This picture is a 24 KB <code>.j3k</code> file shown with <code>&lt;img data-j3k="astronaut.j3k"&gt;</code> and <code>j3k.js</code>.</p>
    <img data-j3k="astronaut.j3k" width="512" height="512" alt="Astronaut Eileen Collins (NASA, public domain), decoded from a .j3k file">
  </section>

  <footer>
    <a href="https://github.com/sacha9214/jpeg3000">JPEG 3000 on GitHub</a> · experimental format, decoder: <a href="j3k.js">j3k.js</a> (no dependencies)
  </footer>
</main>
<script src="j3k.js"></script>
<script>
  const list = document.getElementById("list"), error = document.getElementById("error");
  const drop = document.getElementById("drop"), input = document.getElementById("file");

  function kb(n) { return n < 1e6 ? (n / 1000).toFixed(1) + " KB" : (n / 1e6).toFixed(2) + " MB"; }

  async function show(file) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const t0 = performance.now();
    let im;
    try {
      im = J3K.decode(bytes);
    } catch (e) {
      error.textContent = file.name + ": " + e.message;
      return;
    }
    const ms = performance.now() - t0;
    const kind = ["grayscale", "grayscale + alpha", "color", "color + alpha"][im.channels - 1];
    const item = document.createElement("article");
    item.className = "item";
    item.innerHTML = "<header><b></b><span></span><button type=button>Save as PNG</button></header><div class=canvas-wrap><canvas></canvas></div>";
    item.querySelector("b").textContent = file.name;
    item.querySelector("span").textContent = im.width + " × " + im.height + " · " + kind + " · " + kb(bytes.length) +
      " (" + (8 * bytes.length / (im.width * im.height)).toFixed(2) + " bit/pixel) · decoded in " + Math.round(ms) + " ms";
    const canvas = item.querySelector("canvas");
    canvas.width = im.width;
    canvas.height = im.height;
    canvas.getContext("2d").putImageData(new ImageData(im.toRGBA(), im.width, im.height), 0, 0);
    item.querySelector("button").onclick = () => canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name.replace(/\.j3k$/i, "") + ".png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
    list.prepend(item);
  }

  function open(files) {
    error.textContent = "";
    for (const f of files) show(f);
  }

  input.addEventListener("change", () => open(input.files));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); open(e.dataTransfer.files); });
  J3K.polyfill();
</script>
</body>
</html>
